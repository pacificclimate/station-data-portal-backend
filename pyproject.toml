[tool.poetry]
name = "sdpb"
version = "12.1.0"
description = "PCIC microservice for station data"
authors = [
    "rod-glover <rglover@uvic.ca>",
    "john-sampson <johnsampson@uvic.ca>",
    "lee-zeman <lzeman@uvic.ca>",
]
license = "GNU General Public License v3 (GPLv3)"
readme = "README.md"
homepage = "http://www.pacificclimate.org/"
repository = "https://github.com/pacificclimate/station-data-portal-backend"
keywords = ["sql", "database", "pcds", "crmp", "climate", "meteorology"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.7",
    "Topic :: Internet",
    "Topic :: Scientific/Engineering",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{ include = "sdpb" }]

[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple/"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.9,<3.14"
PyYAML = "^6.0"
python-dateutil = "^2.8.2"
sqlalchemy = "^2.0"
pycds = { version = "5.0.0", source = "pcic" }
connexion = { version = "^3.3", extras = ["flask", "swagger-ui", "uvicorn"] }
flask-sqlalchemy = "^3.1"
flask-compress = "^1.13"
psycopg2 = ">=2.9.10"
werkzeug = ">=3.0"
redis = ">=5,<7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
testing-postgresql = "^1.3.0"
python-dotenv = "^1.0"
# Black defaults can change with version, which invalidates some code. Update version
# only if you are prepared to re-run Black on entire codebase; best left to a separate PR.
black = "25.1.0"

[tool.poetry.group.deploy.dependencies]
gunicorn = "^21.0"
uvicorn = ">=0.20"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    # connexion uses deprecated jsonschema.RefResolver/RefResolutionError (third-party issue)
    "ignore::DeprecationWarning:connexion",
    #TODO: Remove this when pycds is updated to use datetime.datetime.now(datetime.UTC) instead of datetime.datetime.utcnow()
    # pycds uses datetime.datetime.utcnow() as a SQLAlchemy column default (third-party issue)
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]

